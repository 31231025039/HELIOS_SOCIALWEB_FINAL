<!DOCTYPE html>
<html lang="vi" data-page-css="assets/css/home.css" data-nav-active="home">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trang chủ | Helios</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- CSS chung -->
  <link rel="stylesheet" href="../assets/css/style.css">
  <!-- CSS riêng trang -->
  <link rel="stylesheet" href="../assets/css/home.css">

  <script src="../assets/js/includes.js"></script>
</head>
<body>

<div id="site-navbar" data-include="../components/navbar.html"></div>

<div class="container-xl py-3">
  <div class="row g-3 align-items-start">

    <div data-include="../components/home-sidebar-left.html" style="display:contents"></div>

    <main class="col-12 col-md-8 col-lg-6 align-self-start">
      <div class="h-card mb-3 composer-card">
        <div class="composer-top px-3 pt-3 pb-2">
          <div class="d-flex gap-2 align-items-center">
            <div class="composer-avatar flex-shrink-0">VY</div>
            <div class="composer-input-fake">Bạn muốn chia sẻ gì hôm nay?</div>
          </div>
        </div>
        <div class="composer-actions px-3 pb-3 pt-2">
          <div class="composer-actions-inner d-flex gap-2">
            <button type="button" class="btn btn-light btn-sm text-muted fw-bold composer-action-btn"><i class="bi bi-image text-primary"></i><span>Ảnh</span></button>
            <button type="button" class="btn btn-light btn-sm text-muted fw-bold composer-action-btn"><i class="bi bi-calendar-event text-warning"></i><span>Sự kiện</span></button>
            <button type="button" class="btn btn-light btn-sm text-muted fw-bold composer-action-btn"><i class="bi bi-pencil-square text-danger"></i><span>Bài viết</span></button>
          </div>
        </div>
      </div>

      <!-- Bài viết được render từ feed-posts.js — thêm bài: chỉ thêm object vào FEED_POSTS -->
      <div id="feed-posts"></div>

      <template id="feed-post-template">
        <article class="h-card mb-3">
          <div class="post-content-block px-3 pt-3">
            <div class="d-flex gap-2 mb-2">
              <div class="post-avatar bg-primary" data-post-avatar></div>
              <div>
                <div class="fw-bold"><span data-post-name></span><span class="text-muted fw-normal small d-none" data-post-connection-outer></span></div>
                <div class="text-muted extra-small" data-post-meta></div>
              </div>
            </div>
            <p class="post-body mb-0" data-post-body></p>
          </div>
          <div class="post-img-placeholder text-primary fw-bold d-none" data-post-media></div>
          <div class="px-3 py-2 border-top border-bottom small text-muted d-flex justify-content-between align-items-center">
            <div class="reactions reactions-row d-flex align-items-center gap-1">
              <span class="reaction-pill r-yeuthich" title="Yêu thích — thả tim nội dung"><i class="bi bi-balloon-heart-fill"></i></span>
              <span class="reaction-pill r-ungho" title="Ủng hộ — đồng ý và tán thành"><i class="bi bi-patch-check-fill"></i></span>
              <span class="reaction-pill r-colen" title="Cố lên — động viên"><i class="bi bi-rocket-takeoff-fill"></i></span>
              <span class="reaction-pill r-huuich" title="Hữu ích — học được điều hay"><i class="bi bi-journal-bookmark-fill"></i></span>
              <span class="reaction-pill r-tienbo" title="Tiến bộ — phát triển bản thân"><i class="bi bi-stars"></i></span>
              <span class="reaction-pill r-thuvi" title="Thú vị — nội dung hấp dẫn"><i class="bi bi-emoji-laughing-fill"></i></span>
              <span class="ms-1" data-post-reactions></span>
            </div>
            <span data-post-comments></span>
          </div>
          <div class="d-flex p-1">
            <div class="post-action-like-wrap flex-fill">
              <div class="reaction-picker" role="group" aria-label="Cảm xúc dành cho sinh viên">
                <button type="button" class="reaction-opt" data-label="Yêu thích" title="Yêu thích — thích nội dung, cảm xúc tích cực"><i class="bi bi-balloon-heart-fill r-yeuthich-i"></i><span>Yêu thích</span></button>
                <button type="button" class="reaction-opt" data-label="Ủng hộ" title="Ủng hộ — đồng ý và ủng hộ ý kiến"><i class="bi bi-patch-check-fill r-ungho-i"></i><span>Ủng hộ</span></button>
                <button type="button" class="reaction-opt" data-label="Cố lên" title="Cố lên — động viên bạn trong học tập và tìm việc"><i class="bi bi-rocket-takeoff-fill r-colen-i"></i><span>Cố lên</span></button>
                <button type="button" class="reaction-opt" data-label="Hữu ích" title="Hữu ích — kiến thức, tip hữu ích"><i class="bi bi-journal-bookmark-fill r-huuich-i"></i><span>Hữu ích</span></button>
                <button type="button" class="reaction-opt" data-label="Tiến bộ" title="Tiến bộ — ghi nhận bước tiến, mục tiêu"><i class="bi bi-stars r-tienbo-i"></i><span>Tiến bộ</span></button>
                <button type="button" class="reaction-opt" data-label="Thú vị" title="Thú vị — nội dung hay, gợi hứng"><i class="bi bi-emoji-laughing-fill r-thuvi-i"></i><span>Thú vị</span></button>
              </div>
              <button type="button" class="post-action-btn w-100"><i class="bi bi-hand-thumbs-up"></i> Thích</button>
            </div>
            <button type="button" class="post-action-btn"><i class="bi bi-chat-dots"></i> Bình luận</button>
            <button type="button" class="post-action-btn"><i class="bi bi-share"></i> Chia sẻ</button>
          </div>
        </article>
      </template>
    </main>

    <div data-include="../components/home-sidebar-right.html" style="display:contents"></div>

  </div>
</div>

<div data-include="../components/site-footer.html"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/feed-posts.js"></script>

</body>
</html>
